# GitHub Actions Workflow for RAG Chatbot Backend CI/CD
# T064 - Phase 7: Lint, format check, and test backend code

name: RAG Chatbot Backend CI

on:
  push:
    branches:
      - main
      - 001-rag-chatbot
    paths:
      - 'rag-chatbot/**'
      - '.github/workflows/rag-chatbot-ci.yml'
  pull_request:
    branches:
      - main
      - 001-rag-chatbot
    paths:
      - 'rag-chatbot/**'
      - '.github/workflows/rag-chatbot-ci.yml'

defaults:
  run:
    working-directory: rag-chatbot

jobs:
  # ============================================================================
  # Linting and Formatting Checks
  # ============================================================================
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black mypy

      - name: Run Ruff linter
        run: |
          echo "Running Ruff linter..."
          ruff check src/ --output-format=github
        continue-on-error: false

      - name: Run Black format check
        run: |
          echo "Checking code formatting with Black..."
          black --check --diff src/
        continue-on-error: false

      - name: Run MyPy type checking
        run: |
          echo "Running MyPy type checker..."
          pip install -e .
          mypy src/
        continue-on-error: true  # Type checking warnings don't fail CI

  # ============================================================================
  # Unit and Integration Tests
  # ============================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run pytest
        run: |
          echo "Running tests with pytest..."
          # Create empty tests directory if it doesn't exist
          mkdir -p tests
          # Run pytest if tests exist, otherwise skip
          if [ -d "tests" ] && [ "$(ls -A tests/*.py 2>/dev/null)" ]; then
            pytest tests/ -v --cov=src --cov-report=xml --cov-report=term
          else
            echo "No tests found - skipping test execution"
            echo "Note: Add tests to rag-chatbot/tests/ to enable test coverage"
          fi
        continue-on-error: true  # Don't fail if no tests exist yet

      - name: Upload coverage reports
        if: success()
        uses: codecov/codecov-action@v3
        with:
          files: ./rag-chatbot/coverage.xml
          flags: backend
          name: rag-chatbot-backend
        continue-on-error: true

  # ============================================================================
  # Build Validation
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          echo "Building Docker image..."
          docker build -t rag-chatbot:ci .
        working-directory: rag-chatbot

      - name: Test Docker image
        run: |
          echo "Testing Docker image health..."
          # Run container in background
          docker run -d --name test-container \
            -e OPENAI_API_KEY=test \
            -e QDRANT_URL=http://test \
            -e QDRANT_API_KEY=test \
            -e POSTGRES_URL=postgresql://test:test@test:5432/test \
            rag-chatbot:ci

          # Wait for container to start
          sleep 5

          # Check if container is running
          if docker ps | grep test-container; then
            echo "✅ Docker container started successfully"
          else
            echo "❌ Docker container failed to start"
            docker logs test-container
            exit 1
          fi

          # Cleanup
          docker stop test-container
          docker rm test-container
